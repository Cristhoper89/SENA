server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /static/ {
        try_files $uri =404;
    }

    location ~ ^/(?!static(?:/|$)|api(?:/|$)|(?:index|login|dashboard|caja|cajas|categorias|clientes|configuracion|configuracion-mesas|cierre-caja|factura-cierre|carta|desbloquear|desbloquear_cuenta|gastos|ingredientes|mesas|movimientos|olvido_contrasena|olvido-contrasena|opciones-productos|opciones_productos|pedidos|perfil|productos|recuperar|reportes|usuarios)(?:\.html)?(?:/|$))[^/]+(/.*)?$ {
        rewrite ^/[^/]+/?$ / last;
        rewrite ^/[^/]+(/.*)$ $1 last;
    }

    location = /recuperar {
        rewrite ^ /olvido_contrasena.html last;
    }

    location = /olvido-contrasena {
        rewrite ^ /olvido_contrasena.html last;
    }

    location = /olvido_contrasena {
        rewrite ^ /olvido_contrasena.html last;
    }

    location = /desbloquear {
        rewrite ^ /desbloquear_cuenta.html last;
    }

    location = /opciones-productos {
        rewrite ^ /opciones_productos.html last;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
